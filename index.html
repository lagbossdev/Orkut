<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #dbdbdb;
            --text-color: #262626;
            --blue: #0095f6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar */
        nav {
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 935px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo { font-weight: bold; font-size: 24px; text-decoration: none; color: inherit; }

        /* Feed */
        main {
            margin-top: 90px;
            width: 100%;
            max-width: 600px;
        }

        /* Área de Postagem */
        .post-creator {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            border: none;
            resize: none;
            outline: none;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .btn-post {
            background-color: var(--blue);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            float: right;
        }

        .btn-post:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Card de Post */
        .post-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .post-header {
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #eee;
        }

        .user-name { font-weight: 600; font-size: 14px; }

        .post-content {
            padding: 14px;
            font-size: 14px;
            line-height: 1.5;
            border-top: 1px solid #efefef;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="#" class="logo">SocialGram</a>
        <div id="g_id_onload"
             data-client_id="8393724573-kdnas52bjnhjvtkhahtqchm1p000b0i4.apps.googleusercontent.com"
             data-callback="handleLogin">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>
</nav>

<main>
    <div id="post-area" class="post-creator hidden">
        <textarea id="post-text" placeholder="No que você está pensando?" rows="3"></textarea>
        <button class="btn-post" onclick="createPost()">Publicar</button>
        <div style="clear: both;"></div>
    </div>

    <div id="feed">
        </div>
</main>

<script>
    let currentUser = null;

    // 1. Lidar com o Login do Google
    function handleLogin(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = {
            name: payload.name,
            photo: payload.picture,
            email: payload.email
        };
        
        document.getElementById('post-area').classList.remove('hidden');
        document.querySelector('.g_id_signin').classList.add('hidden');
    }

    // 2. Sistema de Postagem Real (Simulação de Persistência Local para teste)
    // DICA: Para ser real "para todos", conecte o Firebase aqui.
    function createPost() {
        const text = document.getElementById('post-text').value;
        if (!text || !currentUser) return;

        const newPost = {
            userName: currentUser.name,
            userPhoto: currentUser.photo,
            content: text,
            date: new Date().toLocaleString()
        };

        renderPost(newPost, true);
        document.getElementById('post-text').value = '';
    }

    function renderPost(post, prepend = false) {
        const feed = document.getElementById('feed');
        const postHTML = `
            <div class="post-card">
                <div class="post-header">
                    <img src="${post.userPhoto}" class="user-avatar">
                    <span class="user-name">${post.userName}</span>
                </div>
                <div class="post-content">
                    ${post.content}
                </div>
                <div style="padding: 0 14px 14px; font-size: 10px; color: #8e8e8e;">
                    ${post.date}
                </div>
            </div>
        `;
        
        if (prepend) {
            feed.insertAdjacentHTML('afterbegin', postHTML);
        } else {
            feed.innerHTML += postHTML;
        }
    }
</script>

</body>
</html>
