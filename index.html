<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orkut</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root { 
            --orkut-bg: #D4DDED; 
            --orkut-blue-header: #BFD0EA;
            --orkut-pink: #ED2590; 
            --border: #A7BBDD;
            --dark-blue: #5d7eb9;
        }
        
        body { font-family: "Lucida Grande", Tahoma, Verdana, Arial, sans-serif; background: var(--orkut-bg); margin: 0; color: #333; }
        
        nav { background: var(--dark-blue); width: 100%; height: 50px; display: flex; justify-content: center; position: fixed; top: 0; z-index: 100; border-bottom: 2px solid #3b5998; }
        .nav-content { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .logo { color: white; font-size: 28px; font-weight: bold; text-decoration: none; font-style: italic; }
        
        main { width: 100%; max-width: 600px; margin-top: 70px; padding: 10px; box-sizing: border-box; }
        
        /* Post Box Profissional */
        .post-box { background: #fff; border: 1px solid var(--border); padding: 15px; border-radius: 4px; margin-bottom: 20px; box-shadow: 2px 2px 0px rgba(0,0,0,0.05); }
        .caption-input { width: 100%; border: 1px solid #999; padding: 10px; box-sizing: border-box; font-size: 13px; outline: none; resize: none; margin-bottom: 10px; border-radius: 2px; }
        
        .preview-container { position: relative; width: 100%; margin-bottom: 10px; display: none; border: 1px solid #ddd; padding: 5px; background: #f9f9f9; }
        .preview-container img { width: 100%; max-height: 350px; object-fit: contain; display: block; }
        .remove-preview { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-weight: bold; }

        .btn-post { background: var(--orkut-pink); color: #fff; border: 1px solid #b01c6a; padding: 6px 20px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .btn-post:disabled { background: #ccc; border-color: #999; cursor: not-allowed; }

        /* Card de Postagem */
        .post-card { background: #fff; border: 1px solid var(--border); margin-bottom: 25px; border-radius: 4px; overflow: hidden; animation: fadeIn 0.4s; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--orkut-blue-header); border-bottom: 1px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #3b5998; font-size: 13px; }
        .user-pic { width: 35px; height: 35px; border: 1px solid #fff; object-fit: cover; }
        .post-img { width: 100%; display: block; max-height: 600px; object-fit: contain; background: #f0f4f8; }
        .post-text { padding: 12px; font-size: 13px; line-height: 1.6; }

        /* Modal Customizado */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: #fff; border: 2px solid var(--dark-blue); width: 300px; border-radius: 4px; overflow: hidden; }
        .modal-header { background: var(--dark-blue); color: white; padding: 8px; font-size: 12px; font-weight: bold; }
        .modal-body { padding: 20px; font-size: 13px; text-align: center; }
        .modal-footer { padding: 10px; display: flex; justify-content: center; gap: 10px; background: #f0f4f8; }

        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">orkut diz:</div>
        <div class="modal-body" id="modal-msg"></div>
        <div class="modal-footer">
            <button class="btn-post" id="btn-cancel" onclick="closeModal(false)" style="background:#999; border-color:#777">cancelar</button>
            <button class="btn-post" onclick="closeModal(true)">ok</button>
        </div>
    </div>
</div>

<nav>
    <div class="nav-content">
        <a href="#" class="logo">orkut</a>
        <div id="user-nav" class="hidden"><img id="nav-avatar" class="user-pic" src=""></div>
    </div>
</nav>

<main>
    <div id="login-screen" style="background:#fff; padding:40px; border:1px solid var(--border); text-align:center;">
        <h2 style="color:var(--dark-blue)">entrar no orkut</h2>
        <div id="g_id_onload" data-client_id="8393724573-kdnas52bjnhjvtkhahtqchm1p000b0i4.apps.googleusercontent.com" data-callback="handleLogin"></div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <div id="app-content" class="hidden">
        <div class="post-box">
            <div id="preview-container" class="preview-container">
                <button class="remove-preview" onclick="limparSelecao()">×</button>
                <img id="preview-img">
            </div>

            <textarea id="post-input" class="caption-input" placeholder="No que você está pensando agora?" rows="2"></textarea>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label for="file-input" style="cursor: pointer; color: var(--dark-blue); font-size: 12px; font-weight:bold;">
                    📷 [adicionar foto]
                </label>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="gerarPreview(this)">
                <button id="btn-publicar" class="btn-post" onclick="enviarPost()">postar</button>
            </div>
        </div>
        <div id="feed"></div>
    </div>
</main>

<script>
    // FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyDwtEYsXqq5Ed131USZ9tZhFqaJvD0480M",
        authDomain: "fir-75fa8.firebaseapp.com",
        projectId: "fir-75fa8",
        storageBucket: "fir-75fa8.appspot.com",
        messagingSenderId: "390149251555",
        appId: "1:390149251555:web:6471327ebf6c42cced00d6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    let userAtual = null;

    // MODAL
    let modalResolve;
    function showModal(msg, isAlert = false) {
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('btn-cancel').style.display = isAlert ? 'none' : 'block';
        return new Promise(res => modalResolve = res);
    }
    function closeModal(val) {
        document.getElementById('modal-overlay').style.display = 'none';
        if(modalResolve) modalResolve(val);
    }

    // LOGIN
    function handleLogin(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        userAtual = { name: payload.name, photo: payload.picture, id: payload.sub };
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('user-nav').classList.remove('hidden');
        document.getElementById('nav-avatar').src = payload.picture;
        carregarPosts();
    }

    // PREVIEW E LEGENDA
    function gerarPreview(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('preview-container').style.display = 'block';
                document.getElementById('post-input').placeholder = "Adicione uma legenda para esta foto...";
                document.getElementById('post-input').focus();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function limparSelecao() {
        document.getElementById('file-input').value = "";
        document.getElementById('preview-container').style.display = 'none';
        document.getElementById('post-input').placeholder = "No que você está pensando agora?";
    }

    // PUBLICAR
    async function enviarPost() {
        const txt = document.getElementById('post-input').value;
        const file = document.getElementById('file-input').files[0];
        const btn = document.getElementById('btn-publicar');

        if (!txt.trim() && !file) return;

        btn.disabled = true;
        btn.innerText = "enviando...";

        try {
            let url = "";
            if (file) {
                // Caminho organizado por pasta de usuário
                const ref = storage.ref().child(`posts/${userAtual.id}/${Date.now()}_${file.name}`);
                const uploadTask = await ref.put(file);
                url = await uploadTask.ref.getDownloadURL();
            }

            await db.collection("posts").add({
                uid: userAtual.id,
                nome: userAtual.name,
                foto: userAtual.photo,
                texto: txt,
                imagemPost: url,
                data: firebase.firestore.FieldValue.serverTimestamp(),
                likes: 0,
                commCount: 0
            });

            document.getElementById('post-input').value = "";
            limparSelecao();
        } catch (e) {
            console.error(e);
            showModal("Erro ao publicar foto. Verifique se o Firebase Storage está ativado.", true);
        } finally {
            btn.disabled = false;
            btn.innerText = "postar";
        }
    }

    // FEED
    function carregarPosts() {
        db.collection("posts").orderBy("data", "desc").onSnapshot(snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                const id = doc.id;
                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="user-info"><img src="${p.foto}" class="user-pic"> <span>${p.nome}</span></div>
                            ${p.uid === userAtual.id ? `<div style="cursor:pointer" onclick="deletarPost('${id}')">•••</div>` : ''}
                        </div>
                        ${p.imagemPost ? `<img src="${p.imagemPost}" class="post-img">` : ''}
                        <div class="post-text"><strong>${p.nome}:</strong> ${p.texto}</div>
                    </div>`;
            });
        });
    }

    async function deletarPost(id) {
        if (await showModal("Deseja apagar esta postagem?")) {
            await db.collection("posts").doc(id).delete();
        }
    }
</script>
</body>
</html>
