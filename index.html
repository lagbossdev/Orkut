<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orkut / instagram clone</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root { --orkut-blue: #5d7eb9; --orkut-pink: #ED2590; --border: #dbdbdb; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #fafafa; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        nav { background: #fff; width: 100%; height: 60px; display: flex; justify-content: center; border-bottom: 1px solid var(--border); position: fixed; top: 0; z-index: 100; }
        .nav-content { width: 100%; max-width: 935px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        
        main { width: 100%; max-width: 600px; margin-top: 80px; padding: 10px; box-sizing: border-box; }
        
        #login-screen { background: #fff; border: 1px solid var(--border); padding: 40px; text-align: center; border-radius: 8px; margin-top: 50px; }
        
        .post-box { background: #fff; border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; border: none; font-size: 16px; outline: none; margin-bottom: 10px; resize: none; font-family: inherit; }
        
        .btn-post { background: var(--orkut-blue); color: #fff; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; float: right; font-weight: bold; }
        .btn-post:disabled { background: #ccc; cursor: not-allowed; }
        .btn-logout { background: none; border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        .post-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; padding: 0 0 15px 0; overflow: hidden; }
        .post-header { display: flex; align-items: center; gap: 10px; padding: 15px; font-weight: 600; color: var(--orkut-blue); }
        .post-content { padding: 0 15px 10px 15px; font-size: 15px; line-height: 1.4; }
        .user-pic { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .post-img { width: 100%; display: block; }
        
        .hidden { display: none !important; }
        #preview-img { width: 100%; border-radius: 8px; margin-bottom: 10px; object-fit: cover; max-height: 300px; }
    </style>
</head>
<body>

<nav>
    <div class="nav-content">
        <span style="font-size: 24px; font-weight: bold; color: var(--orkut-pink);">orkut</span>
        <div id="user-nav" class="hidden" style="display: flex; align-items: center; gap: 10px;">
            <button class="btn-logout" onclick="logout()">Sair</button>
            <img id="nav-avatar" class="user-pic" src="">
        </div>
    </div>
</nav>

<main>
    <div id="login-screen">
        <h2 style="color: var(--orkut-blue);">Entrar no orkut</h2>
        <p style="color: #666;">Conecte-se para ver as postagens reais</p><br>
        <div id="g_id_onload"
             data-client_id="8393724573-kdnas52bjnhjvtkhahtqchm1p000b0i4.apps.googleusercontent.com"
             data-callback="handleLogin"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill"></div>
    </div>

    <div id="app-content" class="hidden">
        <div class="post-box">
            <textarea id="post-input" placeholder="No que você está pensando?" rows="3"></textarea>
            
            <img id="preview-img" class="hidden">

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 10px;">
                <label for="file-input" style="cursor: pointer; color: var(--orkut-blue); font-weight: bold;">
                    📷 <span style="font-size: 14px;">Adicionar Foto</span>
                </label>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="mostrarPreview(this)">
                
                <button id="btn-publicar" class="btn-post" onclick="enviarPost()">Publicar</button>
            </div>
            <div style="clear:both"></div>
        </div>
        <div id="feed"></div>
    </div>
</main>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyDwtEYsXqq5Ed131USZ9tZhFqaJvD0480M",
        authDomain: "fir-75fa8.firebaseapp.com",
        projectId: "fir-75fa8",
        storageBucket: "fir-75fa8.appspot.com", // Ajustado para o padrão
        messagingSenderId: "390149251555",
        appId: "1:390149251555:web:6471327ebf6c42cced00d6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    let userAtual = null;

    window.onload = function () {
        google.accounts.id.disableAutoSelect();
    };

    function handleLogin(response) {
        try {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            userAtual = { name: payload.name, photo: payload.picture, email: payload.email };

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('user-nav').classList.remove('hidden');
            document.getElementById('nav-avatar').src = payload.picture;

            carregarPosts();
        } catch (e) {
            console.error("Erro ao processar login:", e);
            logout();
        }
    }

    function logout() {
        google.accounts.id.disableAutoSelect();
        userAtual = null;
        location.reload();
    }

    function mostrarPreview(input) {
        const preview = document.getElementById('preview-img');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function enviarPost() {
        const txt = document.getElementById('post-input').value;
        const file = document.getElementById('file-input').files[0];
        const btn = document.getElementById('btn-publicar');

        if ((!txt.trim() && !file) || !userAtual) return;

        btn.disabled = true;
        btn.innerText = "Enviando...";

        let urlImagem = "";

        try {
            if (file) {
                const nomeArquivo = `posts/${Date.now()}_${userAtual.name.replace(/\s/g, '_')}`;
                const ref = storage.ref().child(nomeArquivo);
                await ref.put(file);
                urlImagem = await ref.getDownloadURL();
            }

            await db.collection("posts").add({
                nome: userAtual.name,
                foto: userAtual.photo,
                texto: txt,
                imagemPost: urlImagem,
                data: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Resetar formulário
            document.getElementById('post-input').value = "";
            document.getElementById('file-input').value = "";
            document.getElementById('preview-img').classList.add('hidden');
            
        } catch (err) {
            console.error(err);
            alert("Erro ao publicar! Verifique as regras do Storage/Firestore.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Publicar";
        }
    }

    function carregarPosts() {
        db.collection("posts").orderBy("data", "desc").onSnapshot(snapshot => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snapshot.forEach(doc => {
                const p = doc.data();
                const imagemHTML = p.imagemPost ? `<img src="${p.imagemPost}" class="post-img">` : "";
                
                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <img src="${p.foto}" class="user-pic">
                            <span>${p.nome}</span>
                        </div>
                        ${imagemHTML}
                        <div class="post-content">
                            <strong>${p.nome}</strong> ${p.texto}
                        </div>
                    </div>
                `;
            });
        });
    }
</script>

</body>
</html>
