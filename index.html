<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orkut</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root { 
            --orkut-pink: #ED2590; 
            --bg-body: #ffffff;
            --bg-cards: #fce9f3;
            --border: #f9badb;
        }
        
        body { font-family: "Lucida Grande", Tahoma, Arial, sans-serif; background: var(--bg-body); margin: 0; padding-bottom: 70px; color: #333; }
        
        /* HEADER */
        header { position: fixed; top: 0; width: 100%; z-index: 1000; background: white; border-bottom: 1px solid var(--border); }
        .top-nav { background: var(--orkut-pink); height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .logo { color: white; font-size: 22px; font-weight: bold; font-style: italic; text-decoration: none; }
        .top-icons { display: flex; gap: 15px; color: white; }
        .top-icons svg { cursor: pointer; width: 24px; height: 24px; transition: 0.2s; }
        .top-icons svg:hover { opacity: 0.7; }

        .search-area { padding: 10px; display: flex; justify-content: center; background: white; }
        .search-input { width: 90%; max-width: 500px; border: 1px solid var(--border); padding: 8px 15px; border-radius: 20px; outline: none; background: #fffcfd; }

        /* MAIN CONTENT */
        main { width: 100%; max-width: 550px; margin: 110px auto 0; padding: 10px; box-sizing: border-box; }
        .view-title { color: var(--orkut-pink); font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; text-transform: uppercase; }

        /* POST BOX */
        .post-box { background: white; border: 2px solid var(--orkut-pink); padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        textarea { width: 100%; border: none; font-size: 14px; outline: none; resize: none; min-height: 50px; }
        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }

        /* CARDS */
        .post-card { background: white; border: 1px solid var(--border); margin-bottom: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px rgba(237,37,144,0.08); }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px; }
        .user-pic { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid var(--orkut-pink); }
        .post-img { width: 100%; display: block; max-height: 450px; object-fit: contain; background: #fafafa; }
        .post-text { padding: 12px; font-size: 14px; }

        /* AÇÕES DO CARD */
        .card-actions { display: flex; gap: 20px; padding: 12px; border-top: 1px solid #f9f9f9; }
        .action-btn { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; font-weight: bold; color: #777; transition: 0.3s; }
        .action-btn.active-like { color: var(--orkut-pink); }
        .action-btn.active-save { color: #f5a623; }
        .action-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
        .action-btn.active-like svg, .action-btn.active-save svg { fill: currentColor; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
        .nav-item { cursor: pointer; color: #999; flex: 1; text-align: center; padding: 10px; }
        .nav-item.active { color: var(--orkut-pink); }
        .nav-item span { display: block; font-size: 10px; margin-top: 2px; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<header id="header-app" class="hidden">
    <div class="top-nav">
        <a href="#" class="logo" onclick="trocarTela('feed')">orkut</a>
        <div class="top-icons">
            <svg onclick="trocarTela('minhas_curtidas')" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <svg onclick="trocarTela('meus_salvos')" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </div>
    </div>
    <div class="search-area">
        <input type="text" id="search-input" class="search-input" placeholder="Pesquisar..." oninput="filtrar(this.value)">
    </div>
</header>

<main>
    <div id="login-screen" style="text-align: center; margin-top: 50px;">
        <h2 style="color:var(--orkut-pink)">bem-vindo</h2>
        <div id="g_id_onload" data-client_id="8393724573-kdnas52bjnhjvtkhahtqchm1p000b0i4.apps.googleusercontent.com" data-callback="handleLogin"></div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <div id="app-content" class="hidden">
        <h2 id="view-title" class="view-title">Início</h2>
        
        <div id="area-postagem" class="post-box">
            <textarea id="post-input" placeholder="O que você quer contar hoje?"></textarea>
            <img id="preview-post" class="hidden" style="width:100%; border-radius:8px; margin-top:10px;">
            <div class="post-footer">
                <label for="file-input" style="cursor:pointer; color:var(--orkut-pink); font-size:12px; font-weight:bold;">📷 + FOTO</label>
                <input type="file" id="file-input" class="hidden" onchange="previewImg(this)">
                <button onclick="enviarPost()" style="background:var(--orkut-pink); color:white; border:none; padding:6px 20px; border-radius:20px; font-weight:bold; cursor:pointer;">POSTAR</button>
            </div>
        </div>

        <div id="feed-container"></div>
    </div>
</main>

<nav id="bottom-bar" class="bottom-nav hidden">
    <div class="nav-item active" id="nav-home" onclick="trocarTela('feed')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Início</span>
    </div>
    <div class="nav-item" id="nav-explorar" onclick="trocarTela('explorar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Explorar</span>
    </div>
</nav>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDwtEYsXqq5Ed131USZ9tZhFqaJvD0480M",
        authDomain: "fir-75fa8.firebaseapp.com",
        projectId: "fir-75fa8",
        storageBucket: "fir-75fa8.appspot.com",
        messagingSenderId: "390149251555",
        appId: "1:390149251555:web:6471327ebf6c42cced00d6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    
    let userAtual = null;
    let telaAtual = 'feed';

    function handleLogin(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        userAtual = { name: payload.name, photo: payload.picture, id: payload.sub };
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('header-app').classList.remove('hidden');
        document.getElementById('bottom-bar').classList.remove('hidden');
        trocarTela('feed');
    }

    function trocarTela(novaTela) {
        telaAtual = novaTela;
        const titleMap = {
            'feed': 'Início',
            'explorar': '🔥 Mais Relevantes',
            'minhas_curtidas': '❤️ Posts que curti',
            'meus_salvos': '🔖 Posts salvos'
        };
        document.getElementById('view-title').innerText = titleMap[novaTela];
        
        // Esconder área de postagem fora do Início
        document.getElementById('area-postagem').classList.toggle('hidden', novaTela !== 'feed');
        
        // Destacar Nav Bottom
        document.getElementById('nav-home').classList.toggle('active', novaTela === 'feed');
        document.getElementById('nav-explorar').classList.toggle('active', novaTela === 'explorar');

        carregarConteudo();
    }

    function previewImg(input) {
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const p = document.getElementById('preview-post');
                p.src = e.target.result;
                p.classList.remove('hidden');
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function enviarPost() {
        const txt = document.getElementById('post-input').value;
        const file = document.getElementById('file-input').files[0];
        if (!txt && !file) return;

        let url = "";
        if (file) {
            const ref = storage.ref().child(`v2/${userAtual.id}/${Date.now()}`);
            await ref.put(file);
            url = await ref.getDownloadURL();
        }

        await db.collection("posts").add({
            uid: userAtual.id, nome: userAtual.name, foto: userAtual.photo,
            texto: txt, imagem: url, data: firebase.firestore.FieldValue.serverTimestamp(),
            likes: 0, saves: 0
        });

        document.getElementById('post-input').value = "";
        document.getElementById('file-input').value = "";
        document.getElementById('preview-post').classList.add('hidden');
    }

    async function toggleInteraction(postId, colecao, campo) {
        const ref = db.collection("posts").doc(postId).collection(colecao).doc(userAtual.id);
        const doc = await ref.get();
        if (!doc.exists) {
            await ref.set({ user: userAtual.id });
            await db.collection("posts").doc(postId).update({ [campo]: firebase.firestore.FieldValue.increment(1) });
        } else {
            await ref.delete();
            await db.collection("posts").doc(postId).update({ [campo]: firebase.firestore.FieldValue.increment(-1) });
        }
    }

    async function carregarConteudo() {
        let query = db.collection("posts");
        
        if (telaAtual === 'explorar') {
            query = query.orderBy("likes", "desc");
        } else {
            query = query.orderBy("data", "desc");
        }

        query.onSnapshot(async snap => {
            const feed = document.getElementById('feed-container');
            feed.innerHTML = "";

            for (const doc of snap.docs) {
                const p = doc.data();
                const id = doc.id;

                // Checar se EU curti/salvei para pintar o ícone
                const curtiu = (await db.collection("posts").doc(id).collection("likes").doc(userAtual.id).get()).exists;
                const salvou = (await db.collection("posts").doc(id).collection("saves").doc(userAtual.id).get()).exists;

                // Filtros de tela (Curti/Salvei)
                if (telaAtual === 'minhas_curtidas' && !curtiu) continue;
                if (telaAtual === 'meus_salvos' && !salvou) continue;

                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div style="display:flex;align-items:center;gap:10px">
                                <img src="${p.foto}" class="user-pic">
                                <span style="font-weight:bold;font-size:13px">${p.nome}</span>
                            </div>
                            ${p.uid === userAtual.id ? `<span style="cursor:pointer;color:#ccc" onclick="deletar('${id}')">excluir</span>` : ''}
                        </div>
                        ${p.imagem ? `<img src="${p.imagem}" class="post-img">` : ''}
                        <div class="post-text">${p.texto}</div>
                        <div class="card-actions">
                            <div class="action-btn ${curtiu ? 'active-like' : ''}" onclick="toggleInteraction('${id}', 'likes', 'likes')">
                                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <span>${p.likes || 0}</span>
                            </div>
                            <div class="action-btn ${salvou ? 'active-save' : ''}" onclick="toggleInteraction('${id}', 'saves', 'saves')">
                                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                                <span>${p.saves || 0}</span>
                            </div>
                        </div>
                    </div>`;
            }
        });
    }

    async function deletar(id) {
        if (confirm("Apagar postagem?")) await db.collection("posts").doc(id).delete();
    }

    function filtrar(v) {
        const termo = v.toLowerCase();
        document.querySelectorAll('.post-card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(termo) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
