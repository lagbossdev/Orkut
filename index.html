<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orkut</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root { 
            --orkut-bg: #D4DDED; 
            --orkut-blue-header: #BFD0EA;
            --orkut-pink: #ED2590; 
            --orkut-card-bg: #E7EDF6;
            --border: #A7BBDD;
        }
        
        body { font-family: "Lucida Grande", Tahoma, Verdana, Arial, sans-serif; background: var(--orkut-bg); margin: 0; color: #333; }
        
        /* Navbar */
        nav { background: #5d7eb9; width: 100%; height: 50px; display: flex; justify-content: center; position: fixed; top: 0; z-index: 100; border-bottom: 2px solid #3b5998; }
        .nav-content { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .logo { color: white; font-size: 28px; font-weight: bold; text-decoration: none; font-style: italic; }
        
        main { width: 100%; max-width: 600px; margin-top: 70px; padding: 10px; box-sizing: border-box; }
        
        /* Post Box */
        .post-box { background: #fff; border: 1px solid var(--border); padding: 15px; border-radius: 4px; margin-bottom: 20px; box-shadow: 2px 2px 0px rgba(0,0,0,0.05); }
        textarea { width: 100%; border: 1px solid #999; padding: 8px; box-sizing: border-box; font-size: 13px; outline: none; resize: none; margin-bottom: 10px; border-radius: 2px; }
        
        .btn-post { background: var(--orkut-pink); color: #fff; border: 1px solid #b01c6a; padding: 5px 15px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: transform 0.1s; }
        .btn-post:active { transform: scale(0.95); }

        /* Card */
        .post-card { background: #fff; border: 1px solid var(--border); margin-bottom: 25px; border-radius: 4px; overflow: hidden; animation: fadeIn 0.5s ease; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--orkut-blue-header); border-bottom: 1px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #3b5998; font-size: 13px; }
        .user-pic { width: 35px; height: 35px; border: 1px solid #fff; object-fit: cover; border-radius: 2px; }
        
        .post-img { width: 100%; display: block; border-bottom: 1px solid #eee; background: #fff; }
        .post-text { padding: 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }

        /* Interações Profissionais */
        .post-actions { padding: 10px 15px; display: flex; gap: 20px; background: #fff; }
        .action-item { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #555; font-size: 12px; font-weight: bold; transition: color 0.3s; }
        
        .icon-svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; overflow: visible; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* Cores de Ativo com Animação */
        .is-liked { color: #e0245e; }
        .is-liked .icon-svg { fill: #e0245e; stroke: #e0245e; transform: scale(1.2); }
        .is-saved { color: #f5a623; }
        .is-saved .icon-svg { fill: #f5a623; stroke: #f5a623; }

        /* Aba de Comentários */
        .comments-section { 
            background: #f4f7fb; border-top: 1px solid #e0e0e0; 
            display: none; opacity: 0; transform: translateY(-10px); transition: all 0.3s ease;
        }
        .comments-section.open { display: block; opacity: 1; transform: translateY(0); padding: 12px; }

        .comment-item { font-size: 12px; padding: 8px 0; border-bottom: 1px dotted #ccc; display: flex; justify-content: space-between; align-items: flex-start; }
        .comment-content { flex: 1; }
        .btn-del-comm { color: #999; cursor: pointer; font-size: 10px; margin-left: 10px; font-weight: normal; }
        .btn-del-comm:hover { color: red; }

        .comment-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        .comment-input-wrap input { flex: 1; border: 1px solid #ccc; padding: 6px; font-size: 12px; border-radius: 2px; outline: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<nav>
    <div class="nav-content">
        <a href="#" class="logo">orkut</a>
        <div id="user-nav" class="hidden">
            <img id="nav-avatar" class="user-pic" src="">
        </div>
    </div>
</nav>

<main>
    <div id="login-screen">
        <h2 style="color: #3b5998;">bem-vindo ao orkut</h2>
        <div id="g_id_onload" data-client_id="8393724573-kdnas52bjnhjvtkhahtqchm1p000b0i4.apps.googleusercontent.com" data-callback="handleLogin"></div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <div id="app-content" class="hidden">
        <div class="post-box">
            <textarea id="post-input" placeholder="No que você está pensando agora?" rows="2"></textarea>
            <img id="preview-img" class="hidden" style="width:100%; max-height:250px; object-fit:cover; margin-bottom:10px; border:1px solid #ccc;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label for="file-input" style="cursor: pointer; color: #3b5998; font-size: 11px; font-weight:bold;">[+] adicionar foto</label>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="mostrarPreview(this)">
                <button id="btn-publicar" class="btn-post" onclick="enviarPost()">enviar</button>
            </div>
        </div>
        <div id="feed"></div>
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDwtEYsXqq5Ed131USZ9tZhFqaJvD0480M",
        authDomain: "fir-75fa8.firebaseapp.com",
        projectId: "fir-75fa8",
        storageBucket: "fir-75fa8.appspot.com",
        messagingSenderId: "390149251555",
        appId: "1:390149251555:web:6471327ebf6c42cced00d6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    let userAtual = null;

    function handleLogin(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        userAtual = { name: payload.name, photo: payload.picture, id: payload.sub };
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('user-nav').classList.remove('hidden');
        document.getElementById('nav-avatar').src = payload.picture;
        carregarPosts();
    }

    function mostrarPreview(input) {
        const preview = document.getElementById('preview-img');
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.classList.remove('hidden'); }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function enviarPost() {
        const txt = document.getElementById('post-input').value;
        const file = document.getElementById('file-input').files[0];
        if (!txt.trim() && !file) return;
        const btn = document.getElementById('btn-publicar');
        btn.disabled = true;

        let urlImg = "";
        try {
            if (file) {
                const ref = storage.ref().child(`posts/${userAtual.id}/${Date.now()}`);
                await ref.put(file);
                urlImg = await ref.getDownloadURL();
            }
            await db.collection("posts").add({
                uid: userAtual.id, nome: userAtual.name, foto: userAtual.photo,
                texto: txt, imagemPost: urlImg, data: firebase.firestore.FieldValue.serverTimestamp(),
                likes: 0, saves: 0, commCount: 0
            });
            document.getElementById('post-input').value = "";
            document.getElementById('preview-img').classList.add('hidden');
            document.getElementById('file-input').value = "";
        } catch (e) { alert(e); }
        btn.disabled = false;
    }

    async function toggleInteracao(postId, colecao, campoContador, element) {
        const ref = db.collection("posts").doc(postId).collection(colecao).doc(userAtual.id);
        const doc = await ref.get();
        const activeClass = colecao === 'likes' ? 'is-liked' : 'is-saved';

        if (!doc.exists) {
            await ref.set({ time: Date.now() });
            await db.collection("posts").doc(postId).update({ [campoContador]: firebase.firestore.FieldValue.increment(1) });
            element.classList.add(activeClass);
        } else {
            await ref.delete();
            await db.collection("posts").doc(postId).update({ [campoContador]: firebase.firestore.FieldValue.increment(-1) });
            element.classList.remove(activeClass);
        }
    }

    function toggleComments(id) {
        const sec = document.getElementById(`sec-${id}`);
        sec.classList.toggle('open');
    }

    async function addComment(id) {
        const inp = document.getElementById(`inp-${id}`);
        if (!inp.value.trim()) return;
        await db.collection("posts").doc(id).collection("comments").add({
            uid: userAtual.id, nome: userAtual.name, texto: inp.value, data: firebase.firestore.FieldValue.serverTimestamp()
        });
        await db.collection("posts").doc(id).update({ commCount: firebase.firestore.FieldValue.increment(1) });
        inp.value = "";
    }

    async function deletarComentario(postId, commentId) {
        if (confirm("excluir comentário?")) {
            await db.collection("posts").doc(postId).collection("comments").doc(commentId).delete();
            await db.collection("posts").doc(postId).update({ commCount: firebase.firestore.FieldValue.increment(-1) });
        }
    }

    function carregarPosts() {
        db.collection("posts").orderBy("data", "desc").onSnapshot(snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                const id = doc.id;
                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="user-info"><img src="${p.foto}" class="user-pic"> <span>${p.nome}</span></div>
                            <div style="cursor:pointer; color:#777;" onclick="if(confirm('deletar post?')) db.collection('posts').doc('${id}').delete()">•••</div>
                        </div>
                        ${p.imagemPost ? `<img src="${p.imagemPost}" class="post-img">` : ''}
                        <div class="post-text"><strong>${p.nome}:</strong> ${p.texto}</div>
                        <div class="post-actions">
                            <div class="action-item" onclick="toggleInteracao('${id}', 'likes', 'likes', this)">
                                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <span class="count">${p.likes || 0}</span>
                            </div>
                            <div class="action-item" onclick="toggleComments('${id}')">
                                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.9A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5z"></path></svg>
                                <span>${p.commCount || 0}</span>
                            </div>
                            <div class="action-item" onclick="toggleInteracao('${id}', 'saves', 'saves', this)">
                                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                                <span>${p.saves || 0}</span>
                            </div>
                        </div>
                        <div id="sec-${id}" class="comments-section">
                            <div id="list-${id}"></div>
                            <div class="comment-input-wrap">
                                <input id="inp-${id}" placeholder="escreva um comentário...">
                                <button onclick="addComment('${id}')" class="btn-post">ok</button>
                            </div>
                        </div>
                    </div>`;
                escutarComentarios(id);
            });
        });
    }

    function escutarComentarios(id) {
        db.collection("posts").doc(id).collection("comments").orderBy("data", "asc").onSnapshot(s => {
            const list = document.getElementById(`list-${id}`);
            if (!list) return;
            list.innerHTML = "";
            s.forEach(cDoc => {
                const c = cDoc.data();
                const isMyComm = c.uid === userAtual.id;
                list.innerHTML += `
                    <div class="comment-item">
                        <div class="comment-content"><strong>${c.nome}:</strong> ${c.texto}</div>
                        ${isMyComm ? `<span class="btn-del-comm" onclick="deletarComentario('${id}', '${cDoc.id}')">[x]</span>` : ''}
                    </div>`;
            });
        });
    }
</script>
</body>
</html>
