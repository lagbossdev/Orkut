<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orkut</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --orkut-blue: #5d7eb9; --orkut-pink: #ED2590; --border: #dbdbdb; }
        body { font-family: sans-serif; background: #fafafa; margin: 0; display: flex; flex-direction: column; align-items: center; }
        nav { background: #fff; width: 100%; height: 60px; display: flex; justify-content: center; border-bottom: 1px solid var(--border); position: fixed; top: 0; z-index: 100; }
        .nav-content { width: 100%; max-width: 935px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        main { width: 100%; max-width: 600px; margin-top: 80px; padding: 10px; }
        #login-screen { background: #fff; border: 1px solid var(--border); padding: 40px; text-align: center; border-radius: 8px; margin-top: 50px; }
        .post-box { background: #fff; border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; border: none; font-size: 16px; outline: none; margin-bottom: 10px; }
        .btn-post { background: var(--orkut-blue); color: #fff; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; float: right; font-weight: bold; }
        .post-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; padding: 12px; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: bold; color: var(--orkut-blue); }
        .user-pic { width: 35px; height: 35px; border-radius: 50%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<nav>
    <div class="nav-content">
        <span style="font-size: 24px; font-weight: bold; color: var(--orkut-pink);">orkut</span>
        <div id="user-nav" class="hidden">
            <img id="nav-avatar" class="user-pic" src="">
        </div>
    </div>
</nav>

<main>
    <div id="login-screen">
        <h2 style="color: var(--orkut-blue);">Entrar no orkut</h2>
        <p>Use sua conta do Google para continuar</p><br>
        <div id="g_id_onload"
             data-client_id="8393724573-kdnas52bjnhjvtkhahtqchm1p000b0i4.apps.googleusercontent.com"
             data-callback="handleLogin">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill"></div>
    </div>

    <div id="app-content" class="hidden">
        <div class="post-box">
            <textarea id="post-input" placeholder="O que você quer contar?" rows="3"></textarea>
            <button class="btn-post" onclick="enviarPost()">Publicar</button>
            <div style="clear:both"></div>
        </div>
        <div id="feed"></div>
    </div>
</main>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyDwtEYsXqq5Ed131USZ9tZhFqaJvD0480M",
        authDomain: "fir-75fa8.firebaseapp.com",
        projectId: "fir-75fa8",
        storageBucket: "fir-75fa8.firebasestorage.app",
        messagingSenderId: "390149251555",
        appId: "1:390149251555:web:6471327ebf6c42cced00d6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let userAtual = null;

    // FUNÇÃO DE LOGIN (CHAMADA PELO GOOGLE)
    function handleLogin(response) {
        console.log("Resposta recebida do Google");
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        
        userAtual = { name: payload.name, photo: payload.picture };

        // Troca visual de telas
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('user-nav').classList.remove('hidden');
        document.getElementById('nav-avatar').src = payload.picture;

        carregarPosts();
    }

    // ENVIAR POST PARA O BANCO
    function enviarPost() {
        const txt = document.getElementById('post-input').value;
        if (!txt.trim()) return;

        db.collection("posts").add({
            nome: userAtual.name,
            foto: userAtual.photo,
            texto: txt,
            data: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            document.getElementById('post-input').value = "";
        }).catch(err => alert("Erro ao postar: Verifique as regras do seu Firebase!"));
    }

    // CARREGAR POSTS EM TEMPO REAL
    function carregarPosts() {
        db.collection("posts").orderBy("data", "desc").onSnapshot(snapshot => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snapshot.forEach(doc => {
                const p = doc.data();
                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <img src="${p.foto}" class="user-pic">
                            <span>${p.nome}</span>
                        </div>
                        <div>${p.texto}</div>
                    </div>
                `;
            });
        });
    }
</script>

</body>
</html>
