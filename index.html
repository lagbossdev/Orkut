<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orkut</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --orkut-blue: #5d7eb9;
            --orkut-pink: #ED2590;
            --bg-gray: #fafafa;
            --white: #ffffff;
            --border: #dbdbdb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-gray);
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Navbar estilo Instagram Moderno */
        nav {
            background-color: var(--white);
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .nav-content {
            width: 100%;
            max-width: 935px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--orkut-pink);
            text-decoration: none;
            letter-spacing: -1px;
        }

        /* Container de Conteúdo */
        main {
            width: 100%;
            max-width: 600px;
            margin-top: 80px;
            padding: 10px;
        }

        /* Tela de Login */
        #login-screen {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 40px 20px;
            text-align: center;
            border-radius: 8px;
            margin-top: 50px;
        }

        /* Box de Postagem */
        .post-box {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            border: none;
            resize: none;
            font-size: 16px;
            outline: none;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .btn-post {
            background-color: var(--orkut-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }

        .btn-post:disabled { opacity: 0.5; }

        /* Card de Feed */
        .post-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .post-header {
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name { font-weight: 600; font-size: 14px; color: var(--orkut-blue); }

        .post-content {
            padding: 0 12px 12px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .post-time {
            padding: 0 12px 12px;
            font-size: 10px;
            color: #8e8e8e;
            text-transform: uppercase;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<nav>
    <div class="nav-content">
        <a href="#" class="logo">orkut</a>
        <div id="user-nav" class="hidden">
            <img id="nav-avatar" class="user-pic" src="" alt="">
        </div>
    </div>
</nav>

<main>
    <div id="login-screen">
        <h1 style="color: var(--orkut-blue); margin-bottom: 10px;">orkut</h1>
        <p style="color: #8e8e8e; margin-bottom: 30px;">Entre para compartilhar momentos.</p>
        <div style="display: flex; justify-content: center;">
            <div id="g_id_onload"
                 data-client_id="8393724573-kdnas52bjnhjvtkhahtqchm1p000b0i4.apps.googleusercontent.com"
                 data-callback="handleLogin">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <div class="post-box">
            <textarea id="post-input" placeholder="No que você está pensando?" rows="3"></textarea>
            <button class="btn-post" id="btn-publish">Publicar</button>
            <div style="clear: both;"></div>
        </div>

        <div id="feed">
            </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Configuração com suas chaves integradas
    const firebaseConfig = {
        apiKey: "AIzaSyDwtEYsXqq5Ed131USZ9tZhFqaJvD0480M",
        authDomain: "fir-75fa8.firebaseapp.com",
        databaseURL: "https://fir-75fa8-default-rtdb.firebaseio.com",
        projectId: "fir-75fa8",
        storageBucket: "fir-75fa8.firebasestorage.app",
        messagingSenderId: "390149251555",
        appId: "1:390149251555:web:6471327ebf6c42cced00d6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentUser = null;

    // Login do Google
    window.handleLogin = (response) => {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = { name: payload.name, photo: payload.picture };

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('user-nav').classList.remove('hidden');
        document.getElementById('nav-avatar').src = payload.picture;

        startFeed();
    };

    // Publicar Post
    document.getElementById('btn-publish').onclick = async () => {
        const text = document.getElementById('post-input').value.trim();
        if (!text || !currentUser) return;

        const btn = document.getElementById('btn-publish');
        btn.disabled = true;

        try {
            await addDoc(collection(db, "posts"), {
                userName: currentUser.name,
                userPhoto: currentUser.photo,
                text: text,
                createdAt: serverTimestamp()
            });
            document.getElementById('post-input').value = "";
        } catch (e) {
            alert("Erro ao salvar no banco. Verifique as Regras (Rules) no Firebase!");
        } finally {
            btn.disabled = false;
        }
    };

    // Escutar Feed em Tempo Real
    function startFeed() {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const time = data.createdAt ? data.createdAt.toDate().toLocaleString() : "agora";
                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <img src="${data.userPhoto}" class="user-pic">
                            <span class="user-name">${data.userName}</span>
                        </div>
                        <div class="post-content">${data.text}</div>
                        <div class="post-time">${time}</div>
                    </div>
                `;
            });
        });
    }
</script>

</body>
</html>
